<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ClearData SIEM</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .stats-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            flex: 1;
            background-color: #161b22;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #30363d;
            text-align: center;
        }
        .card h3 { margin: 0; color: #8b949e; font-size: 0.9em; }
        .card p { margin: 10px 0 0; font-size: 2em; font-weight: bold; }
        .critical { color: #f85149; border-top: 4px solid #f85149; }
        .warning { color: #d29922; border-top: 4px solid #d29922; }
        .info { color: #58a6ff; border-top: 4px solid #58a6ff; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #161b22;
            border: 1px solid #30363d;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #30363d;
        }
        th { background-color: #21262d; color: #c9d1d9; }
        tr:hover { background-color: #21262d; }
        
        .logout-btn {
            color: #f85149;
            text-decoration: none;
            border: 1px solid #f85149;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8em;
        }
        .logout-btn:hover { background-color: rgba(248, 81, 73, 0.1); }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ ClearData Monitor</h1>
        <a href="/logout" class="logout-btn">LOGOUT</a>
    </div>

    <div class="stats-container">
        <div class="card critical">
            <h3>CRITICAL THREATS</h3>
            <p id="stat-critical">0</p>
        </div>
        <div class="card warning">
            <h3>WARNINGS</h3>
            <p id="stat-warning">0</p>
        </div>
        <div class="card info">
            <h3>INFO EVENTS</h3>
            <p id="stat-info">0</p>
        </div>
    </div>

    <h3>Recent Events Log</h3>
    <table>
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Source</th>
                <th>Type</th>
                <th>Message</th>
            </tr>
        </thead>
        <tbody id="events-table-body">
            </tbody>
    </table>

    <script>
        function fetchData() {
            fetch('/api/data')
                .then(response => {
                    if (response.status === 401) {
                        window.location.href = "/login";
                    }
                    return response.json();
                })
                .then(data => {
                    // Update Stats
                    document.getElementById('stat-critical').innerText = data.stats.critical;
                    document.getElementById('stat-warning').innerText = data.stats.warning;
                    document.getElementById('stat-info').innerText = data.stats.info;

                    // Update Table
                    const tableBody = document.getElementById('events-table-body');
                    tableBody.innerHTML = ''; // Clear old data

                    data.events.forEach(event => {
                        const row = `<tr>
                            <td>${event.timestamp}</td>
                            <td>${event.source}</td>
                            <td>${event.type}</td>
                            <td>${event.message}</td>
                        </tr>`;
                        tableBody.innerHTML += row;
                    });
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        // Poll every 2 seconds
        setInterval(fetchData, 2000);
        // Initial call
        fetchData();
    </script>
</body>
</html>
